<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>E aí, você está pronto para novas oportunidades?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            purple: '#4b1e8e',
                            violet: '#6d28d9',
                            magenta: '#d946ef',
                            orange: '#f97316',
                            light: '#f8fafc',
                            dark: '#0f172a'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'card': '0 20px 40px -15px rgba(0,0,0,0.05)',
                        'glow': '0 0 20px rgba(109, 40, 217, 0.5)',
                        'static-highlight': '0 0 25px rgba(249, 115, 22, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.2)'
                    }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow: hidden;
            color: #1e293b;
            background-color: #f1f5f9;
            background-image: 
                radial-gradient(at 0% 0%, rgba(109, 40, 217, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(249, 115, 22, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(217, 70, 239, 0.15) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(75, 30, 142, 0.15) 0px, transparent 50%);
            background-attachment: fixed;
        }

        /* Gradientes de Texto */
        .text-gradient-primary {
            background: linear-gradient(135deg, #6d28d9 0%, #d946ef 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .slide-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            perspective: 1000px;
        }

        /* Slide Responsivo */
        .slide {
            width: 95%;
            max-width: 1280px;
            height: 92vh;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(75, 30, 142, 0.15), 0 0 0 1px rgba(255,255,255,0.2) inset;
            padding: 1.5rem;
            display: none;
            flex-direction: column;
            position: absolute;
            opacity: 0;
            transform: translateY(20px) scale(0.98);
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* Scrollbar customizada para mobile e desktop */
        .slide::-webkit-scrollbar { width: 6px; }
        .slide::-webkit-scrollbar-track { background: transparent; }
        .slide::-webkit-scrollbar-thumb { background: rgba(109, 40, 217, 0.2); border-radius: 10px; }
        .slide::-webkit-scrollbar-thumb:hover { background: rgba(109, 40, 217, 0.4); }

        @media (min-width: 768px) {
            .slide {
                width: 90%;
                height: 85vh;
                padding: 3.5rem;
                border-radius: 2.5rem;
                overflow-y: hidden; /* Remove scroll interno em telas grandes se couber */
            }
        }

        .slide.active {
            display: flex;
            opacity: 1;
            transform: translateY(0) scale(1);
            z-index: 10;
        }

        .slide.prev-out {
            display: flex;
            opacity: 0;
            transform: translateX(-30px) scale(0.95) rotateY(5deg);
            z-index: 5;
        }

        .slide.next-out {
            display: flex;
            opacity: 0;
            transform: translateX(30px) scale(0.95) rotateY(-5deg);
            z-index: 5;
        }

        .deco-circle {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        
        .content-z {
            position: relative;
            z-index: 1;
        }

        /* Controles de Navegação Responsivos */
        .nav-zone {
            position: fixed;
            top: 0;
            bottom: 0;
            width: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        @media (min-width: 768px) {
            .nav-zone { width: 8vw; min-width: 80px; }
        }

        .nav-btn-modern {
            width: 35px;
            height: 60px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6d28d9;
            font-size: 1rem;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        @media (min-width: 768px) {
            .nav-btn-modern {
                width: 50px;
                height: 90px;
                border-radius: 25px;
                font-size: 1.5rem;
                background: rgba(255, 255, 255, 0.4);
            }
        }

        .nav-zone:hover .nav-btn-modern {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(109, 40, 217, 0.3);
            border-color: rgba(109, 40, 217, 0.3);
        }

        .nav-zone-prev { left: 0; }
        .nav-zone-next { right: 0; }
        .nav-zone-prev:hover .nav-btn-modern i { transform: translateX(-3px); }
        .nav-zone-next:hover .nav-btn-modern i { transform: translateX(3px); }
        .nav-btn-modern i { transition: transform 0.3s ease; }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 1.5rem;
            box-shadow: var(--tw-shadow-card);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .glass-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px rgba(109, 40, 217, 0.15);
        }

        .gradient-border-card {
            position: relative;
            background: white;
            border-radius: 1.5rem;
            z-index: 1;
        }
        .gradient-border-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 1.6rem;
            background: linear-gradient(135deg, #6d28d9, #f97316);
            z-index: -1;
            opacity: 0.3;
            transition: opacity 0.3s ease;
        }

        /* Footer Responsivo */
        .slide-footer {
            margin-top: auto;
            padding: 1rem;
            margin-left: -1.5rem;
            margin-right: -1.5rem;
            margin-bottom: -1.5rem;
            background-color: #ffffff !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            border-top: 1px solid rgba(0,0,0,0.05);
            position: relative;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .slide-footer {
                padding: 1.5rem 3.5rem;
                margin-left: -3.5rem;
                margin-right: -3.5rem;
                margin-bottom: -3.5rem;
                flex-direction: row;
                justify-content: space-between;
                gap: 0;
            }
        }

        .logo-img {
            height: 40px;
            object-fit: contain;
            mix-blend-mode: normal !important;
        }
        @media (min-width: 768px) {
            .logo-img { height: 50px; }
        }

        /* Modal Responsivo */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            z-index: 9999;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }
        .modal-content {
            background: white;
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }
        @media (min-width: 768px) {
            .modal-content {
                border-radius: 2rem;
                padding: 3.5rem;
                width: 90%;
            }
        }
        .modal-overlay.active .modal-content { transform: scale(1); }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.25rem;
            z-index: 10;
        }
        .modal-close:hover {
            background: #e2e8f0;
            color: #ef4444;
            transform: rotate(90deg);
        }
    </style>
</head>
<body>

    <div class="slide-container" id="presentation">
        
        <div class="slide active" id="slide-1" style="background: linear-gradient(135deg, #1e1b4b 0%, #4c1d95 100%); border: none; color: white;">
            <div class="deco-circle hidden md:block" style="width: 600px; height: 600px; background: radial-gradient(circle, rgba(249,115,22,0.4) 0%, transparent 70%); top: -200px; right: -100px;"></div>
            <div class="deco-circle hidden md:block" style="width: 400px; height: 400px; background: radial-gradient(circle, rgba(217,70,239,0.3) 0%, transparent 70%); bottom: -100px; left: -100px;"></div>
            
            <!-- QR Code Topo Esquerdo -->
            <div class="absolute top-6 left-6 md:top-10 md:left-10 flex flex-col items-center z-20">
                <span class="text-white font-bold text-[10px] md:text-sm uppercase tracking-wider mb-2 drop-shadow-md">
                    Acesse esse material
                </span>
                <div class="bg-white p-2 rounded-xl shadow-2xl border-2 border-white/20">
                    <img src="qr_perguntas_emprego.png" alt="QR Code Material" class="w-24 h-24 md:w-36 md:h-36 object-contain">
                </div>
            </div>

            <div class="flex-1 flex flex-col justify-center items-center text-center space-y-6 md:space-y-8 content-z pb-6 md:pb-0">
                <div class="flex flex-col items-center">
                    <img src="https://raichu-uploads.s3.amazonaws.com/logo_se-liga-nessa-historia_WRTKvZ.png" alt="Se liga na dica" class="w-24 h-24 md:w-36 md:h-36 mb-2 md:mb-4 rounded-full border-4 border-white/30 shadow-glow bg-white/5 backdrop-blur-sm p-3" style="object-fit: contain;">
                </div>
                
                <!-- Tipografia Fluida Responsiva -->
                <h1 class="text-4xl sm:text-5xl md:text-7xl font-black leading-tight tracking-tight text-white drop-shadow-lg px-2">
                    E aí, você está pronto para <br class="hidden md:block">
                    <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-pink-500 to-purple-400">novas oportunidades?</span>
                </h1>
                
                <p class="text-lg md:text-xl text-indigo-100 max-w-3xl font-light leading-relaxed px-4">
                    Desvendando o verdadeiro significado das perguntas de entrevista e aprendendo a construir respostas estratégicas que destacam o seu valor.
                </p>
            </div>
            
            <div class="slide-footer">
                <img src="https://arquidiocesecuiaba.org.br/wp-content/uploads/2024/11/salesiano-dom-bosco.jpg" alt="Logo Salesiano Dom Bosco" class="logo-img">
                <span class="font-bold text-slate-800 flex items-center text-sm md:text-lg">
                    <img src="https://static.vecteezy.com/system/resources/previews/018/930/413/non_2x/instagram-logo-instagram-icon-transparent-free-png.png" alt="Instagram" class="w-5 h-5 md:w-6 md:h-6 mr-2 object-contain">
                    @prof.tenebroso
                </span>
            </div>
        </div>

    </div>

    <div id="modal-container" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-close" onclick="closeModal()" title="Fechar">
                <i class="fas fa-times"></i>
            </div>
            <div id="modal-body">
                <!-- Conteúdo dinâmico aqui -->
            </div>
        </div>
    </div>

    <!-- Navegação adaptada para telas menores (setas laterais) -->
    <div class="nav-zone nav-zone-prev" onclick="prevSlide()" title="Slide Anterior">
        <div class="nav-btn-modern shadow-glass">
            <i class="fas fa-chevron-left"></i>
        </div>
    </div>
    <div class="nav-zone nav-zone-next" onclick="nextSlide()" title="Próximo Slide">
        <div class="nav-btn-modern shadow-glass">
            <i class="fas fa-chevron-right"></i>
        </div>
    </div>

    <script>
        let currentSlide = 1;
        const totalSlides = 8;
        let isAnimating = false;

        const modalsData = {
            'q1-sem': { title: 'Sem Experiência', icon: 'fas fa-seedling', bg: 'bg-brand-orange', color: 'text-brand-orange', subtitle: 'Foco em formação e soft skills.', text: '"Atualmente estou estudando [Curso] no Salesiano, onde desenvolvi grande interesse por [Área da vaga]. Nos trabalhos em grupo, costumo assumir o papel de organização. Sou muito focado em aprender e busco essa primeira oportunidade para aplicar minha vontade de crescer na prática."' },
            'q1-com': { title: 'Com Experiência', icon: 'fas fa-briefcase', bg: 'bg-brand-violet', color: 'text-brand-violet', subtitle: 'Fórmula: Presente + Passado + Futuro.', text: '"Hoje atuo como [Cargo] onde desenvolvi fortes habilidades em [Habilidade]. Nos últimos 2 anos, consegui [Conquista rápida]. Agora, busco uma oportunidade como esta, onde eu possa usar minha experiência em [X] para ajudar a equipe a [Y]."' },
            
            'q2-sem': { title: 'Sem Experiência', icon: 'fas fa-seedling', bg: 'bg-brand-orange', color: 'text-brand-orange', subtitle: 'Motivo para começar a trabalhar.', text: '"Como este será meu primeiro emprego, minha motivação principal é colocar em prática o que venho aprendendo na escola e assumir novas responsabilidades, iniciando minha carreira em uma empresa estruturada como a de vocês."' },
            'q2-com': { title: 'Com Experiência', icon: 'fas fa-briefcase', bg: 'bg-brand-violet', color: 'text-brand-violet', subtitle: 'Busca por desafios, não fuga.', text: '"Sou muito grato pelo tempo que passei na [Empresa X], aprendi muito lá. Porém, cheguei em um momento onde busco novos desafios profissionais e mais oportunidades de crescimento na área de [Área da vaga], algo que o momento atual da minha antiga empresa não permitia."' },
            
            'q3-sem': { title: 'Sem Experiência', icon: 'fas fa-seedling', bg: 'bg-brand-orange', color: 'text-brand-orange', subtitle: 'Conquistas acadêmicas ou projetos.', text: '"Minha maior conquista até o momento foi liderar um projeto escolar sobre [Tema] onde tiramos a nota máxima. Eu organizei o cronograma de toda a equipe e garantimos a entrega antes do prazo, o que me ensinou muito sobre gestão de tempo e trabalho em equipe."' },
            'q3-com': { title: 'Com Experiência', icon: 'fas fa-briefcase', bg: 'bg-brand-violet', color: 'text-brand-violet', subtitle: 'Método STAR (Situação, Tarefa, Ação, Resultado).', text: '"No meu trabalho anterior, percebi que o atendimento estava lento. Sugeri a criação de um checklist padrão (Ação). Após implementarmos, reduzimos o tempo de espera dos clientes em 20% (Resultado), o que melhorou muito o feedback recebido."' },
            
            'q4-sem': { title: 'Sem Experiência', icon: 'fas fa-seedling', bg: 'bg-brand-orange', color: 'text-brand-orange', subtitle: 'Erro de estudante + Correção.', text: '"Uma vez, calculei mal o tempo para entregar dois trabalhos importantes e entreguei um incompleto. Assumi o erro. A partir dali, comecei a usar o Google Agenda para mapear tudo. Nunca mais perdi um prazo e aprendi a me organizar melhor."' },
            'q4-com': { title: 'Com Experiência', icon: 'fas fa-briefcase', bg: 'bg-brand-violet', color: 'text-brand-violet', subtitle: 'Erro de processo + Ação corretiva.', text: '"No início na empresa X, passei uma informação errada a um cliente por não ter conferido o sistema. Eu pedi desculpas e resolvi na hora. Aprendi a importância da dupla checagem e criei o hábito de revisar tudo duas vezes desde então."' },
            
            'm-motiva': { title: 'O que te motiva?', icon: 'fas fa-heartbeat', bg: 'bg-brand-violet', color: 'text-brand-violet', subtitle: 'Alinhamento com o que a vaga oferece.', text: '<strong class="text-brand-orange text-lg md:text-xl">Sem Experiência:</strong><br>"Aprender coisas novas e ver que o meu esforço gera resultados, seja tirando uma nota boa ou ajudando num evento escolar."<br><br><strong class="text-brand-violet text-lg md:text-xl">Com Experiência:</strong><br>"Bater metas e trabalhar em equipe. Gosto do sentimento de dever cumprido quando entregamos um projeto com qualidade e vemos o impacto final."' },
            
            'm-lider': { title: 'O que espera do líder?', icon: 'fas fa-users', bg: 'bg-brand-orange', color: 'text-brand-orange', subtitle: 'Autonomia e estilo de liderança.', text: '<strong class="text-slate-800 text-lg md:text-xl">Uma resposta equilibrada:</strong><br><br>"Espero um líder que ofereça feedbacks construtivos e direcione os objetivos com clareza, mas que também dê espaço para que eu possa trabalhar com autonomia e mostrar minhas ideias em um ambiente colaborativo e de respeito."' }
        };

        function openModal(id) {
            const data = modalsData[id];
            if(!data) return;

            const modalBody = document.getElementById('modal-body');
            modalBody.innerHTML = `
                <div class="flex flex-col md:flex-row items-center gap-4 md:gap-6 mb-6 text-center md:text-left">
                    <div class="w-16 h-16 md:w-20 md:h-20 rounded-2xl md:rounded-3xl ${data.bg} text-white flex items-center justify-center text-3xl md:text-4xl shadow-xl shrink-0">
                        <i class="${data.icon}"></i>
                    </div>
                    <h2 class="text-3xl md:text-4xl font-black text-slate-800">${data.title}</h2>
                </div>
                <p class="text-base md:text-xl font-bold ${data.color} mb-6 uppercase tracking-widest flex items-center justify-center md:justify-start text-center md:text-left">
                    <i class="fas fa-search-lightbulb mr-2 md:mr-3"></i> ${data.subtitle}
                </p>
                <div class="bg-slate-50 p-6 md:p-10 rounded-2xl md:rounded-3xl border border-slate-200 shadow-inner relative">
                    <i class="fas fa-quote-left absolute top-4 left-4 md:top-6 md:left-6 text-3xl md:text-4xl text-slate-200"></i>
                    <p class="text-lg md:text-2xl text-slate-700 italic font-light leading-relaxed pl-6 md:pl-10 pt-2">
                        ${data.text}
                    </p>
                </div>
            `;
            document.getElementById('modal-container').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-container').classList.remove('active');
        }

        document.getElementById('modal-container').addEventListener('click', function(e) {
            if(e.target === this) closeModal();
        });
        
        document.addEventListener('keydown', (e) => {
            if(e.key === 'Escape') closeModal();
        });

        function updateSlides(oldIndex, newIndex, direction) {
            if (isAnimating) return;
            isAnimating = true;

            const oldSlide = document.getElementById(`slide-${oldIndex}`);
            const newSlide = document.getElementById(`slide-${newIndex}`);

            // Reseta scroll do novo slide ao topo
            newSlide.scrollTop = 0;

            oldSlide.classList.remove('active', 'prev-out', 'next-out');
            
            if (direction === 'next') {
                oldSlide.classList.add('prev-out');
                newSlide.style.transform = 'translateX(30px) scale(0.95) rotateY(-5deg)';
            } else {
                oldSlide.classList.add('next-out');
                newSlide.style.transform = 'translateX(-30px) scale(0.95) rotateY(5deg)';
            }

            newSlide.style.display = 'flex';
            void newSlide.offsetWidth; // Reflow
            newSlide.style.transform = '';

            setTimeout(() => {
                newSlide.classList.remove('prev-out', 'next-out');
                newSlide.classList.add('active');
            }, 10);

            setTimeout(() => {
                oldSlide.style.display = 'none';
                oldSlide.classList.remove('prev-out', 'next-out');
                isAnimating = false;
            }, 600); 
        }

        function nextSlide() {
            if (currentSlide < totalSlides) {
                let next = currentSlide + 1;
                updateSlides(currentSlide, next, 'next');
                currentSlide = next;
            }
        }

        function prevSlide() {
            if (currentSlide > 1) {
                let prev = currentSlide - 1;
                updateSlides(currentSlide, prev, 'prev');
                currentSlide = prev;
            }
        }

        document.addEventListener('keydown', (e) => {
            if(document.getElementById('modal-container').classList.contains('active')) return;
            
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault(); 
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                prevSlide();
            }
        });
    </script>
</body>
</html>
