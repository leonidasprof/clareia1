<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise e Visualização de Dados</title>
    <!-- Tailwind CSS para estilização rápida -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Variáveis de cores baseadas nas imagens de referência */
        :root {
            --bg-purple: #B222FF; /* Cor de fundo roxa vibrante */
            --box-black: #0D0D0D; /* Fundo preto da caixa */
            --box-gray: #EAEAEA;  /* Fundo cinza claro da área de questões */
            --text-yellow: #FFF133; /* Amarelo das estrelas e interrogação */
            --text-white: #FFFFFF;
            --text-black: #000000;
            --btn-bg: #F4F4F4;
            --btn-hover: #D0D0D0;
            --btn-border: #000000;
            --correct-bg: #86efac; /* Verde claro para acerto */
            --wrong-bg: #fca5a5;   /* Vermelho claro para erro */
        }

        body {
            background-color: var(--bg-purple);
            background-image: radial-gradient(circle at 10% 20%, rgba(0,0,0,0.05) 0%, transparent 20%), 
                              radial-gradient(circle at 90% 80%, rgba(0,0,0,0.05) 0%, transparent 20%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }

        /* Estilização da caixa principal do Quiz inspirada no "quiz.png" */
        .quiz-container {
            background-color: var(--box-black);
            border-radius: 16px;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 600px;
            position: relative;
            overflow: hidden;
            border: 4px solid var(--box-black);
        }

        .quiz-header {
            background-color: var(--box-black);
            color: var(--text-white);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 2rem;
            text-transform: uppercase;
        }

        .quiz-header .question-number {
            font-family: 'Arial Black', Impact, sans-serif;
            letter-spacing: 2px;
        }

        .quiz-header .decorations {
            color: var(--text-yellow);
            font-family: monospace;
            font-size: 1.5rem;
            line-height: 1;
        }

        .quiz-body {
            background-color: var(--box-gray);
            padding: 30px 20px;
            border-radius: 0 0 12px 12px;
        }

        /* Elementos decorativos (Interrogação e Estrelas simplificadas via CSS/Unicode) */
        .decoration-question-mark {
            position: absolute;
            top: -10px;
            right: 10px;
            font-size: 5rem;
            color: var(--text-yellow);
            font-family: 'Arial Black', sans-serif;
            text-shadow: 3px 3px 0 var(--text-black), -1px -1px 0 var(--text-black), 1px -1px 0 var(--text-black), -1px 1px 0 var(--text-black), 1px 1px 0 var(--text-black);
            transform: rotate(15deg);
            z-index: 10;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 800;
            color: var(--text-black);
            margin-bottom: 25px;
            text-align: center;
            text-transform: uppercase;
        }

        /* Botões das alternativas com estilo inspirado na imagem */
        .option-btn {
            background-color: var(--btn-bg);
            border: 2px solid var(--btn-border);
            border-radius: 8px;
            padding: 15px 20px;
            margin-bottom: 15px;
            width: 100%;
            text-align: left;
            font-size: 1rem;
            font-weight: bold;
            color: var(--text-black);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            display: flex;
            align-items: center;
        }

        /* Ícone simulando o tick/cross da imagem */
        .option-btn::before {
            content: '○';
            display: inline-block;
            margin-right: 10px;
            font-size: 1.2rem;
            font-weight: normal;
        }

        .option-btn:hover:not(:disabled) {
            background-color: var(--btn-hover);
            transform: translateX(5px);
        }

        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.9;
        }

        /* Estados de resposta */
        .option-btn.correct {
            background-color: var(--correct-bg);
            border-color: #166534;
        }
        .option-btn.correct::before {
            content: '✓';
            color: #166534;
        }

        .option-btn.wrong {
            background-color: var(--wrong-bg);
            border-color: #991b1b;
        }
        .option-btn.wrong::before {
            content: '✕';
            color: #991b1b;
        }

        /* Feedback da justificativa */
        #feedback-container {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background-color: #fff;
            border: 2px dashed var(--box-black);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        
        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        /* Tela de Resultados com fundo inspirado no laranja.jpg */
        #result-screen {
            display: none;
            background: linear-gradient(135deg, #FFB347 0%, #FF7B00 100%);
            /* Uma textura simples para imitar os pontinhos se possível com CSS */
            background-image: radial-gradient(rgba(255,255,255,0.2) 2px, transparent 2px);
            background-size: 15px 15px;
            padding: 40px 20px;
            border-radius: 0 0 12px 12px;
            text-align: center;
            color: var(--text-white);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .result-title {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .score-display {
            font-size: 4rem;
            font-family: 'Arial Black', sans-serif;
            margin-bottom: 30px;
            color: var(--text-yellow);
            text-shadow: 2px 2px 0 #000;
        }

        .action-btn {
            background-color: var(--box-black);
            color: var(--text-yellow);
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.5);
            transition: transform 0.1s;
            margin: 5px;
        }

        .action-btn:hover {
            transform: translateY(2px) translateX(2px);
            box-shadow: 2px 2px 0px rgba(0,0,0,0.5);
        }
        
        .stats-container {
            display: flex;
            justify-content: flex-start; /* Alinhando os itens à esquerda */
            gap: 20px; /* Espaçamento entre acertos e erros */
            align-items: center;
            background-color: var(--box-black);
            padding: 10px 20px;
            border-bottom: 2px solid var(--box-gray);
            font-size: 0.9rem;
            color: var(--text-white);
            font-weight: bold;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-correct {
            color: #86efac;
        }

        .stat-wrong {
            color: #fca5a5;
        }
        
        /* Controles gerais */
        .controls {
            margin-top: 20px;
            text-align: right;
            display: none;
        }

        /* Responsividade para Celulares */
        @media (max-width: 600px) {
            body {
                padding: 15px 10px;
                justify-content: flex-start;
            }
            .quiz-header {
                padding: 15px;
                font-size: 1.5rem;
            }
            .decoration-question-mark {
                font-size: 3.5rem;
                top: -5px;
                right: 5px;
            }
            .question-text {
                font-size: 1.1rem;
            }
            .option-btn {
                padding: 12px 15px;
                font-size: 0.95rem;
            }
            .action-btn {
                padding: 12px 20px;
                font-size: 1rem;
            }
            .score-display {
                font-size: 3rem;
            }
        }

    </style>
</head>
<body>

    <div class="w-full max-w-[600px] z-0 mb-5 flex flex-row justify-between items-center px-2 gap-3">
        <h1 class="text-[1.2rem] sm:text-2xl md:text-3xl font-black uppercase tracking-tighter text-black flex-1" style="font-family: 'Arial Black', sans-serif; text-shadow: 2px 2px 0px rgba(255,255,255,0.5);">
            <span class="block text-left">Análise e Visualização</span>
            <span class="flex items-center justify-start gap-1 sm:gap-2 mt-1">
                <!-- Ícone de Gráfico representando Dados -->
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 sm:h-7 sm:w-7 md:h-9 md:w-9 text-black flex-shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="filter: drop-shadow(2px 2px 0px rgba(255,255,255,0.5));">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                de Dados
            </span>
        </h1>

        <!-- Logo da Faculdade em Retângulo Arredondado -->
        <div class="bg-white rounded-xl shadow-[4px_4px_0px_rgba(0,0,0,0.3)] border-2 border-black overflow-hidden flex flex-shrink-0 transition-transform hover:scale-105">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRce9bE9X0Uc8wPX4e34SWUYnNTktqe0hCR1xUJvVEL_JCmaofsAj56CS1p&s=10" alt="Logo Instituição" class="h-12 sm:h-14 md:h-16 object-cover" onerror="this.src='https://placehold.co/100x50/FFFFFF/000000?text=Logo'">
        </div>
    </div>

    <div class="quiz-container z-10">
        <div class="decoration-question-mark">?</div>
        
        <div class="stats-container" id="stats-container">
            <div class="stat-item stat-correct">
                <span>Acertos:</span>
                <span id="real-time-correct">0</span>
            </div>
            <div class="stat-item stat-wrong">
                <span>Erros:</span>
                <span id="real-time-wrong">0</span>
            </div>
        </div>

        <div class="quiz-header" id="quiz-header">
            <div class="question-number text-xl" id="question-number-display">#001 / 051</div>
            <div class="decorations">
                x x x<br>x x x
            </div>
        </div>

        <!-- Tela da Pergunta -->
        <div class="quiz-body" id="question-screen">
            <div class="question-text" id="question-text">
                Carregando pergunta...
            </div>
            
            <div id="options-container">
                <!-- Alternativas serão geradas aqui -->
            </div>

            <div id="feedback-container">
                <div class="feedback-title text-black" id="feedback-title">JUSTIFICATIVA:</div>
                <div class="text-gray-800" id="feedback-text"></div>
            </div>

            <div class="controls" id="controls-container">
                <button id="next-btn" class="action-btn text-sm py-2 px-4">Próxima Questão ➔</button>
            </div>
        </div>

        <!-- Tela de Resultados -->
        <div id="result-screen">
            <div class="result-title">FIM DO TESTE!</div>
            <p class="text-xl font-bold mb-2">Você acertou</p>
            <div class="score-display">
                <span id="score-correct">0</span> / <span id="score-total">51</span>
            </div>
            <p class="text-lg font-bold mb-6" id="result-message"></p>
            
            <button id="restart-btn" class="action-btn">TENTE AGORA MESMO! (Refazer)</button>
        </div>
    </div>

    <!-- Link do Instagram Prof. Tenebroso -->
    <a href="https://instagram.com/prof.tenebroso" target="_blank" rel="noopener noreferrer" class="mt-6 mb-2 z-10 flex items-center justify-center gap-2 bg-white text-black text-lg px-5 py-2 rounded-full border-2 border-black shadow-[4px_4px_0px_rgba(0,0,0,0.3)] transition-transform hover:scale-105 hover:-translate-y-1" style="font-family: 'Arial Black', sans-serif;">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
        </svg>
        @prof.tenebroso
    </a>

<script>
    // Dados do Quiz (inseridos diretamente conforme o JSON fornecido)
    const allQuestions = [
  {
    "id": 1,
    "pergunta": "Quando é mais indicado o uso de escalas logarítmicas nos eixos de um gráfico?",
    "alternativas": [
      "Quando os dados representam categorias qualitativas e ordinais sem relação matemática.",
      "Quando os dados apresentam crescimento exponencial ou grande variação de magnitude.",
      "Quando o objetivo é mostrar a proporção exata de partes de um todo em poucas categorias.",
      "Quando a distribuição das variáveis numéricas é perfeitamente normal e simétrica."
    ],
    "resposta_correta": "Quando os dados apresentam crescimento exponencial ou grande variação de magnitude.",
    "justificativa": "As escalas logarítmicas ajudam a comprimir uma grande amplitude de valores, permitindo que taxas de variação em dados exponenciais sejam visualizadas sem que os valores extremos ofusquem as menores magnitudes."
  },
  {
    "id": 2,
    "pergunta": "O que indicam coeficientes de correlação próximos de zero em uma matriz de correlação?",
    "alternativas": [
      "Indicam que há uma relação linear perfeita e inversamente proporcional entre as variáveis.",
      "Sugerem a presença de um forte crescimento exponencial entre as duas variáveis.",
      "Indicam a ausência total de relação ou uma relação linear muito fraca entre as variáveis.",
      "Comprovam que uma variável é a causa direta do comportamento da outra."
    ],
    "resposta_correta": "Indicam a ausência total de relação ou uma relação linear muito fraca entre as variáveis.",
    "justificativa": "Na estatística, o coeficiente de correlação varia de -1 a 1. Valores próximos a 0 demonstram ausência de correlação linear significativa entre os pares analisados."
  },
  {
    "id": 3,
    "pergunta": "Por que a análise descritiva costuma preceder a análise preditiva em um projeto de Ciência de Dados?",
    "alternativas": [
      "Porque a análise descritiva já utiliza Inteligência Artificial avançada, eliminando a necessidade de modelos adicionais.",
      "Porque ela foca exclusivamente em otimizar os parâmetros hiper-parametrizáveis de uma rede neural profunda.",
      "Porque ela garante a compreensão inicial do comportamento histórico dos dados antes que qualquer modelagem futura seja feita.",
      "Porque a análise descritiva serve para gerar as recomendações automáticas finais ao usuário do painel."
    ],
    "resposta_correta": "Porque ela garante a compreensão inicial do comportamento histórico dos dados antes que qualquer modelagem futura seja feita.",
    "justificativa": "A análise descritiva sumariza o que já ocorreu. Entender esse contexto básico é fundamental para garantir a integridade da modelagem preditiva subsequente."
  },
  {
    "id": 4,
    "pergunta": "Qual é a principal vantagem e utilidade do gráfico de violino (violin plot)?",
    "alternativas": [
      "Substituir os mapas de calor na visualização de dados categóricos de alta cardinalidade.",
      "Demonstrar exclusivamente a evolução de uma variável numérica ao longo do tempo.",
      "Combinar a curva de densidade de probabilidade com as medidas de dispersão e tendência central, sendo ótimo para comparar distribuições.",
      "Representar hierarquias estruturais complexas, substituindo gráficos de rede (network graphs)."
    ],
    "resposta_correta": "Combinar a curva de densidade de probabilidade com as medidas de dispersão e tendência central, sendo ótimo para comparar distribuições.",
    "justificativa": "O gráfico de violino funde os conceitos de boxplot e densidade Kernel, revelando nuances da distribuição dos dados (como bimodalidade) que o boxplot pode ocultar."
  },
  {
    "id": 5,
    "pergunta": "Sobre a utilização de animações no processo de Storytelling com Dados, assinale a alternativa correta:",
    "alternativas": [
      "Devem ser utilizadas com cautela, pois podem distrair o público em vez de auxiliar na compreensão.",
      "São sempre recomendadas, pois garantem independentemente do público um maior nível de retenção da informação.",
      "São obrigatórias quando se apresenta um dashboard gerencial para a diretoria.",
      "Devem ser usadas apenas em gráficos estáticos impressos."
    ],
    "resposta_correta": "Devem ser utilizadas com cautela, pois podem distrair o público em vez de auxiliar na compreensão.",
    "justificativa": "Embora atrativas, animações exageradas geram carga cognitiva desnecessária. Devem ser reservadas para casos em que o movimento explica algo (como transição no tempo)."
  },
  {
    "id": 6,
    "pergunta": "A normalização ou padronização dos dados é uma etapa sempre obrigatória antes de gerar visualizações na Análise Exploratória (EDA)?",

      "Não, a visualização exploratória pode e deve muitas vezes analisar a escala bruta original antes de transformações.",

    "resposta_correta": "Não, a visualização exploratória pode e deve muitas vezes analisar a escala bruta original antes de transformações.",

  {

    "pergunta": "Qual das opções a seguir apresenta uma visualização essencialmente projetada para ajudar na identificação matemática de 'outliers' (valores atípicos)?",

      "Gráfico de Pizza",
      "Nuvem de Palavras (Word Cloud)",
      "Diagrama de Caixa (Boxplot)",
      "Gráfico de Área Empilhada"
    ],
    "resposta_correta": "Diagrama de Caixa (Boxplot)",

  {

    "pergunta": "Qual a relação entre a Análise Explanatória de Dados e o Storytelling com Dados?",

    "resposta_correta": "A análise explanatória comunica achados relevantes a um público-alvo, utilizando os princípios do storytelling para construir uma narrativa lógica.",

  {
    "id": 9,

    "justificativa": "Acessibilidade é um pilar de visualização. Usar combinações exclusivas de vermelho e verde para dados cruciais, por exemplo, prejudica usuários daltônicos (deuteranopia)."

  {
    "id": 10,
    "pergunta": "Como ferramentas de Inteligência Artificial e Machine Learning impactam a evolução da análise de dados?",
    "alternativas": [
      "Eliminam totalmente a necessidade de limpar os dados, fazendo correções de forma mágica.",

      "Limitam o volume de dados, pois algoritmos de IA só funcionam em pequenas amostras."

    "resposta_correta": "Permitem detectar padrões de forma automatizada e criar análises preditivas/prescritivas avançadas.",
    "justificativa": "A IA potencializa as capacidades analíticas, indo além da sumarização humana e descobrindo relações complexas e imperceptíveis a olho nu."
  },
  {
    "id": 11,
    "pergunta": "É correto afirmar que o histograma é o gráfico ideal para verificar a relação entre duas variáveis quantitativas distintas?",
    "alternativas": [
      "Sim, ele traça a linha de tendência entre a variável X e Y.",
      "Não, o histograma é univariado (mostra a distribuição de uma única variável); a relação entre duas é vista no Gráfico de Dispersão (Scatter Plot).",
      "Sim, desde que as barras sejam empilhadas.",
      "Não, porque histogramas servem apenas para dados estritamente nominais, como nomes de cidades."
    ],
    "resposta_correta": "Não, o histograma é univariado (mostra a distribuição de uma única variável); a relação entre duas é vista no Gráfico de Dispersão (Scatter Plot).",
    "justificativa": "O histograma exibe a frequência de intervalos de uma variável. Para cruzar o impacto de uma métrica em relação a outra (X vs Y), usa-se dispersão."
  },
  {
    "id": 12,
    "pergunta": "Qual é a definição mais apropriada de uma 'série temporal' no contexto analítico?",
    "alternativas": [
      "Qualquer gráfico de barras que compare diferentes categorias demográficas.",
      "Um modelo de machine learning voltado apenas para o processamento de linguagem natural.",
      "Um conjunto de observações de uma mesma variável coletadas em ordem cronológica, geralmente em intervalos regulares.",
      "Uma matriz de correlação que exclui dados com data e hora."
    ],
    "resposta_correta": "Um conjunto de observações de uma mesma variável coletadas em ordem cronológica, geralmente em intervalos regulares.",
    "justificativa": "A variável principal em uma série temporal é o tempo cronológico (eixo x), servindo para identificar tendências históricas."
  },
  {
    "id": 13,
    "pergunta": "Uma série temporal pode ser desmembrada/caracterizada por componentes específicos. Quais são os mais clássicos?",

      "Amplitude, Frequência Sonora e Decibéis.",
      "Outliers, Mediana e Desvio Padrão.",
      "Tendência, Sazonalidade, Ciclos e Ruído (Residual).",
      "Categorias, Agrupamentos, Correlações e Redes."

    // Configurações do Quiz
    const QUESTIONS_PER_QUIZ = allQuestions.length; // Quantidade de perguntas por tentativa
    let currentQuizQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let wrongAnswers = 0;
    // Elementos do DOM
    const questionNumberDisplay = document.getElementById('question-number-display');
    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const feedbackContainer = document.getElementById('feedback-container');
    const feedbackText = document.getElementById('feedback-text');
    const controlsContainer = document.getElementById('controls-container');
    const nextBtn = document.getElementById('next-btn');
    
    const quizHeader = document.getElementById('quiz-header');
    const questionScreen = document.getElementById('question-screen');
    const resultScreen = document.getElementById('result-screen');
    const scoreCorrectDisplay = document.getElementById('score-correct');
    const scoreTotalDisplay = document.getElementById('score-total');
    const resultMessage = document.getElementById('result-message');
    const restartBtn = document.getElementById('restart-btn');
    
    const realTimeCorrect = document.getElementById('real-time-correct');
    const realTimeWrong = document.getElementById('real-time-wrong');
    const statsContainer = document.getElementById('stats-container');

    // Função para embaralhar um array (Fisher-Yates)
    function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Inicia o Quiz
    function startQuiz() {
        // Esconde resultados, mostra painel principal
        resultScreen.style.display = 'none';
        quizHeader.style.display = 'flex';
        statsContainer.style.display = 'flex';        questionScreen.style.display = 'block';

        // Reseta variáveis
        score = 0;
        wrongAnswers = 0;
        currentQuestionIndex = 0;
        
        updateStatsDisplay();

        // Seleciona e embaralha perguntas
        const shuffledAll = shuffleArray([...allQuestions]);
        currentQuizQuestions = shuffledAll.slice(0, Math.min(QUESTIONS_PER_QUIZ, allQuestions.length));
        
        scoreTotalDisplay.innerText = currentQuizQuestions.length;

        loadQuestion();
    }
    
    function updateStatsDisplay() {
        realTimeCorrect.innerText = score;
        realTimeWrong.innerText = wrongAnswers;
    }

    // Carrega a pergunta atual na tela
    function loadQuestion() {
        resetState();
        
        const currentQuestion = currentQuizQuestions[currentQuestionIndex];
        
        const numStr = (currentQuestionIndex + 1).toString().padStart(3, '0');
        const totalStr = currentQuizQuestions.length.toString().padStart(3, '0');
        questionNumberDisplay.innerText = `#${numStr} / ${totalStr}`;
        
        // Define o texto da pergunta
            questionText.innerText = currentQuestion.pergunta;

            // Embaralha as alternativas para esta pergunta
            const shuffledOptions = shuffleArray([...currentQuestion.alternativas]);

            // Cria os botões
            shuffledOptions.forEach(optionText => {
                const button = document.createElement('button');
                button.innerText = optionText;
                button.classList.add('option-btn');
                
                // Event listener para seleção
                button.addEventListener('click', () => selectAnswer(button, optionText, currentQuestion));
                
                optionsContainer.appendChild(button);
            });
        }

        // Reseta a interface para a próxima pergunta
        function resetState() {
            controlsContainer.style.display = 'none';
            feedbackContainer.style.display = 'none';
            while (optionsContainer.firstChild) {
                optionsContainer.removeChild(optionsContainer.firstChild);
            }
        }

        // Lida com a seleção de uma resposta
    function selectAnswer(selectedButton, selectedText, questionData) {
        const isCorrect = selectedText === questionData.resposta_correta;
        
        if (isCorrect) {
            selectedButton.classList.add('correct');
            score++;
        } else {
            selectedButton.classList.add('wrong');
            wrongAnswers++;
            // Destaca a correta também
            const buttons = optionsContainer.children;
            for (let i = 0; i < buttons.length; i++) {
                if (buttons[i].innerText === questionData.resposta_correta) {
                    buttons[i].classList.add('correct');
                }
            }
        }
        
        updateStatsDisplay();

        // Desabilita todos os botões após a escolha
            const allButtons = optionsContainer.children;
            for (let i = 0; i < allButtons.length; i++) {
                allButtons[i].disabled = true;
            }

            // Mostra justificativa
            feedbackText.innerText = questionData.justificativa;
            feedbackContainer.style.display = 'block';
            
            // Mostra botão de próximo
            controlsContainer.style.display = 'block';
        }

        // Avança para a próxima ou finaliza
        nextBtn.addEventListener('click', () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        });

        // Mostra a tela final
    function showResults() {
        quizHeader.style.display = 'none';
        statsContainer.style.display = 'none';        questionScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        scoreCorrectDisplay.innerText = score;

            // Mensagem dinâmica baseada no acerto
            const percentage = (score / currentQuizQuestions.length) * 100;
            if (percentage === 100) {
                resultMessage.innerText = "PERFEITO! Você é um mestre dos dados!";
            } else if (percentage >= 70) {
                resultMessage.innerText = "MUITO BOM! Consegue acertar todas na próxima?";
            } else if (percentage >= 40) {
                resultMessage.innerText = "NA MÉDIA. Que tal tentar mais uma vez?";
            } else {
                resultMessage.innerText = "PRECISA PRATICAR MAIS. Não desista!";
            }
        }

        // Botão de refazer
        restartBtn.addEventListener('click', startQuiz);

        // Iniciar ao carregar
        startQuiz();

    </script>
