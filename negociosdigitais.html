<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Estudos - Negócios Digitais</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .accordion-content { transition: max-height 0.3s ease-in-out, padding 0.3s ease; max-height: 0; overflow: hidden; }
        .accordion-content.open { max-height: 800px; padding-top: 1.5rem; padding-bottom: 1.5rem; }
        
        /* Custom scrollbar para manter a estética do app */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff7ed; }
        ::-webkit-scrollbar-thumb { background: #f97316; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ea580c; }
    </style>
</head>
<body class="bg-orange-50 text-slate-800 font-sans min-h-screen">

    <!-- Header com o Design System Laranja e Logo -->
    <header class="bg-gradient-to-r from-orange-600 to-orange-500 text-white shadow-xl relative overflow-hidden">
        <!-- Elementos decorativos de fundo -->
        <div class="absolute -top-24 -right-24 w-80 h-80 bg-orange-400 rounded-full opacity-40 blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-orange-800 rounded-full opacity-30 blur-2xl pointer-events-none"></div>
        
        <div class="container mx-auto px-4 py-8 flex flex-col md:flex-row justify-between items-center relative z-10">
            <div class="flex items-center gap-5 w-full">
                <!-- Logo Container -->
                <div class="bg-white p-3 rounded-2xl shadow-lg transform hover:scale-105 transition-transform">
                    <img src="https://www.cesar.school/wp-content/themes/alfama/assets/img/logo_cesar.png" alt="Cesar School" class="h-10 object-contain">
                </div>
                <!-- Title -->
                <div>
                    <h1 class="text-3xl md:text-4xl font-black uppercase tracking-tight drop-shadow-md">
                        <i class="fas fa-bolt mr-2 text-yellow-300"></i> AVA: Negócios
                    </h1>
                    <p class="text-orange-100 text-xs md:text-sm mt-1 font-bold uppercase tracking-widest opacity-90">
                        Revisão Ativa & UX
                    </p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-10 max-w-5xl">
        
        <!-- Navigation Tabs (Pill style do template) -->
        <div class="flex flex-col md:flex-row gap-3 mb-10 bg-white p-3 rounded-[2.5rem] shadow-lg border border-orange-100 relative z-20">
            <button onclick="switchTab('simulados')" id="tab-simulados" class="flex-1 py-4 px-8 rounded-full font-black uppercase tracking-wider transition-all duration-300 bg-orange-500 text-white shadow-md transform scale-100">
                <i class="fas fa-list-check mr-2"></i> Treino Objetivo
            </button>
            <button onclick="switchTab('discursivas')" id="tab-discursivas" class="flex-1 py-4 px-8 rounded-full font-black uppercase tracking-wider transition-all duration-300 text-orange-400 hover:bg-orange-50 hover:text-orange-600 border-2 border-transparent">
                <i class="fas fa-pen-nib mr-2"></i> Estudo Discursivo
            </button>
        </div>

        <!-- TAB: Simulados -->
        <div id="view-simulados" class="fade-in block">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6 mb-10">
                <button onclick="loadUnit(1)" id="btn-u1" class="p-6 bg-white border-4 border-orange-500 bg-orange-50 rounded-[2rem] shadow-lg transition-all text-center group transform hover:-translate-y-1">
                    <div class="text-4xl text-orange-500 mb-3 drop-shadow-sm"><i class="fas fa-users"></i></div>
                    <h3 class="font-black uppercase tracking-wide text-slate-800 text-sm md:text-base">U1: UX & Design</h3>
                </button>
                <button onclick="loadUnit(2)" id="btn-u2" class="p-6 bg-white border-4 border-transparent rounded-[2rem] shadow-sm hover:shadow-lg hover:border-orange-300 transition-all text-center group transform hover:-translate-y-1">
                    <div class="text-4xl text-slate-300 group-hover:text-orange-400 mb-3 transition-colors"><i class="fas fa-microchip"></i></div>
                    <h3 class="font-bold uppercase tracking-wide text-slate-500 group-hover:text-slate-800 text-sm md:text-base transition-colors">U2: Tech & Ágil</h3>
                </button>
                <button onclick="loadUnit(3)" id="btn-u3" class="p-6 bg-white border-4 border-transparent rounded-[2rem] shadow-sm hover:shadow-lg hover:border-orange-300 transition-all text-center group transform hover:-translate-y-1">
                    <div class="text-4xl text-slate-300 group-hover:text-orange-400 mb-3 transition-colors"><i class="fas fa-chart-pie"></i></div>
                    <h3 class="font-bold uppercase tracking-wide text-slate-500 group-hover:text-slate-800 text-sm md:text-base transition-colors">U3: Modelos & Mkt</h3>
                </button>
                <button onclick="loadUnit(4)" id="btn-u4" class="p-6 bg-white border-4 border-transparent rounded-[2rem] shadow-sm hover:shadow-lg hover:border-orange-300 transition-all text-center group transform hover:-translate-y-1">
                    <div class="text-4xl text-slate-300 group-hover:text-orange-400 mb-3 transition-colors"><i class="fas fa-database"></i></div>
                    <h3 class="font-bold uppercase tracking-wide text-slate-500 group-hover:text-slate-800 text-sm md:text-base transition-colors">U4: Dados & BI</h3>
                </button>
            </div>

            <!-- Question Container -->
            <div id="question-container" class="bg-white rounded-[2.5rem] shadow-2xl p-6 md:p-10 hidden border-t-8 border-orange-500 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-orange-50 rounded-bl-[100px] pointer-events-none -z-0"></div>
                
                <div class="relative z-10 flex justify-between items-center mb-8">
                    <span id="unit-badge" class="bg-orange-100 text-orange-700 text-xs md:text-sm font-black px-4 py-2 rounded-full uppercase tracking-widest border border-orange-200"></span>
                    <span id="question-progress" class="text-orange-400 font-bold text-sm tracking-widest uppercase"></span>
                </div>
                
                <h2 id="question-text" class="relative z-10 text-xl md:text-2xl font-black text-slate-800 mb-8 leading-tight"></h2>
                
                <div id="options-container" class="space-y-4 relative z-10">
                    <!-- Options injected here -->
                </div>

                <!-- Feedback Area -->
                <div id="feedback-area" class="relative z-10 mt-8 p-6 rounded-[2rem] hidden border-l-8 shadow-inner">
                    <div class="flex items-start">
                        <div id="feedback-icon" class="text-3xl mr-4 mt-1"></div>
                        <div>
                            <h4 id="feedback-title" class="font-black text-xl uppercase tracking-wide mb-2"></h4>
                            <p id="feedback-text" class="font-medium leading-relaxed"></p>
                        </div>
                    </div>
                    <button id="next-btn" onclick="nextQuestion()" class="mt-8 w-full bg-orange-600 hover:bg-orange-700 text-white font-black uppercase tracking-widest py-5 px-6 rounded-full transition-all shadow-xl hidden transform hover:scale-[1.02]">
                        Avançar <i class="fas fa-arrow-right ml-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- TAB: Discursivas -->
        <div id="view-discursivas" class="fade-in hidden">
            <div class="bg-orange-500 text-white rounded-[2rem] p-8 mb-10 shadow-xl relative overflow-hidden">
                <div class="absolute -right-10 -bottom-10 opacity-20"><i class="fas fa-brain text-[10rem]"></i></div>
                <div class="relative z-10">
                    <h2 class="text-2xl md:text-3xl font-black uppercase tracking-tight mb-3">Modelos Mentais</h2>
                    <p class="text-orange-50 font-medium text-lg leading-relaxed max-w-3xl">Desconstrução pedagógica dos trabalhos <strong>Clareia</strong> e das análises do <strong>Leônidas</strong>. Entenda o "porquê" para dominar as questões abertas da prova.</p>
                </div>
            </div>

            <div id="works-container" class="space-y-8">
                <!-- Works injected here via JS -->
            </div>
        </div>

    </main>

    <script>
        // ==========================================
        // DADOS CONSOLIDADOS (Com gabarito e feedbacks pedagógicos)
        // ==========================================

        const simuladoData = {
            1: [
                {
                    question: "Que abordagem de design a Google utiliza para se destacar no mercado?",
                    options: [
                        "Inovação disruptiva.",
                        "Usabilidade e acessibilidade.",
                        "Design minimalista.",
                        "Foco em publicidade."
                    ],
                    correctAnswer: 2,
                    explanation: "Exato! A página inicial do Google é o exemplo clássico de Design Minimalista. Ao remover distrações (notícias, banners), eles focam 100% da atenção do usuário na tarefa principal: a barra de busca."
                },
                {
                    question: "Como a evolução do design de produtos digitais é descrita no texto?",
                    options: [
                        "Mudança de offline para online.",
                        "De um foco em funcionalidade para uma abordagem centrada na experiência do usuário.",
                        "Transição de manual para automático.",
                        "Foco exclusivo na estética."
                    ],
                    correctAnswer: 1,
                    explanation: "Correto! O design moderno deixou de ser apenas sobre 'fazer funcionar' (funcionalidade). Hoje, o grande diferencial é como o usuário SE SENTE ao usar, focando na jornada e na eliminação de atritos."
                },
                {
                    question: "Qual é o papel do design de produtos digitais na diferenciação de marcas e produtos em um mercado saturado?",
                    options: [
                        "Acelerar o tempo de lançamento do produto.",
                        "Proporcionar uma vantagem competitiva significativa.",
                        "Fornecer produtos mais baratos.",
                        "Garantir a conformidade regulatória."
                    ],
                    correctAnswer: 1,
                    explanation: "Perfeito! Em um mercado onde a tecnologia base é facilmente copiada (como no caso de aplicativos bancários), a Experiência do Usuário (UX) torna-se a verdadeira Vantagem Competitiva, como fez o Nubank."
                },
                {
                    question: "Qual das seguintes técnicas é vital para compreender aspectos subjetivos e complexos do comportamento humano na pesquisa de usuários de tecnologia?",
                    options: [
                        "Modelagem de usuário.",
                        "Técnicas qualitativas.",
                        "Testes de usabilidade.",
                        "Análise de tendências."
                    ],
                    correctAnswer: 1,
                    explanation: "Exato! Enquanto os dados quantitativos (BI) dizem 'O QUE' aconteceu (ex: abandono de tela), as técnicas QUALITATIVAS (entrevistas, imersão) explicam o 'POR QUE' o usuário tomou aquela decisão."
                },
                {
                    question: "Como os mapas de jornada do usuário auxiliam no design de experiência?",
                    options: [
                        "Identificando pontos de fricção e oportunidades de melhoria.",
                        "Testando funcionalidades de produtos.",
                        "Definindo estratégias de marketing.",
                        "Visualizando tendências de mercado."
                    ],
                    correctAnswer: 0,
                    explanation: "Isso! A jornada do usuário serve justamente para mapear cada passo do cliente com o produto e encontrar os 'gargalos' (pontos de fricção) onde ele se frustra ou desiste."
                },
                {
                    question: "Segundo Cooper (2007), qual prática é fundamental no design centrado no usuário?",
                    options: [
                        "Prototipagem e testes iterativos.",
                        "Análise competitiva.",
                        "Benchmarking.",
                        "Pesquisa de mercado."
                    ],
                    correctAnswer: 0,
                    explanation: "Correto! Alan Cooper defende que não devemos assumir que sabemos o que o usuário quer. A prototipagem permite tangibilizar a ideia e iterar (melhorar repetidamente) com base em testes reais."
                },
                {
                    question: "Qual é um aspecto crucial na criação de negócios digitais bem-sucedidos, conforme discutido no texto?",
                    options: [
                        "Estratégias de precificação.",
                        "Foco em publicidade.",
                        "Interação humana com a tecnologia.",
                        "Canais de distribuição."
                    ],
                    correctAnswer: 2,
                    explanation: "Exato! Negócios digitais de sucesso não são feitos apenas de código; eles dependem fundamentalmente de como as PESSOAS interagem e sentem facilidade com essa tecnologia."
                },
                {
                    question: "Qual é o impacto do design centrado no usuário no sucesso de negócios digitais, como indicado no texto?",
                    options: [
                        "Redução de custos operacionais.",
                        "Expansão para novos mercados.",
                        "Melhor retenção de clientes e maior crescimento.",
                        "Aumento na variedade de produtos."
                    ],
                    correctAnswer: 2,
                    explanation: "Perfeito! Quando o produto resolve uma dor real de forma simples e intuitiva (ex: Clareia via WhatsApp), o atrito diminui, o que aumenta a Retenção (o usuário não abandona o app)."
                },
                {
                    question: "Em Design in Tech Report, John Maeda (2018) destaca que o design é um fator-chave para o sucesso no mercado de tecnologia por:",
                    options: [
                        "simplificar processos operacionais.",
                        "estabelecer uma conexão emocional com os usuários.",
                        "aumentar a capacidade de produção.",
                        "reduzir os custos de produção."
                    ],
                    correctAnswer: 1,
                    explanation: "Exatamente! Maeda argumenta que o bom design transcende a funcionalidade pura ao criar laços e reações emocionais (ex: o sentimento de pertencimento à Apple ou o alívio ao entender o 'juridiquês')."
                },
                {
                    question: "O que diferencia a netnografia da etnografia tradicional?",
                    options: [
                        "Foco no comportamento offline.",
                        "Uso de entrevistas.",
                        "Estudo de comunidades e interações online.",
                        "Coleta de dados quantitativos."
                    ],
                    correctAnswer: 2,
                    explanation: "Correto! A Netnografia é a adaptação da etnografia para a Internet, focando na observação de como os usuários se comportam, conversam e interagem em fóruns, redes sociais e comunidades online."
                },
                {
                    question: "Segundo Philip Kotler, qual é o objetivo da análise de tendências e padrões?",
                    options: [
                        "Analisar a competitividade do mercado.",
                        "Prever tendências futuras e desenvolver estratégias inovadoras.",
                        "Criar novos produtos e serviços.",
                        "Melhorar a comunicação com os clientes."
                    ],
                    correctAnswer: 1,
                    explanation: "Isso! O Marketing moderno não é apenas reativo. Ele analisa padrões de dados para PREVER o que o usuário vai desejar no futuro, antecipando-se aos concorrentes."
                },
                {
                    question: "Conforme descrito no texto, quais são as cinco fases do processo de Design Thinking?",
                    options: [
                        "Planejamento, Design, Execução, Controle e Encerramento.",
                        "Pesquisa, Concepção, Construção, Avaliação e Iteração.",
                        "Análise, Desenvolvimento, Teste, Implementação e Manutenção.",
                        "Empatia, Definição, Ideação, Prototipagem e Testes."
                    ],
                    correctAnswer: 3,
                    explanation: "Perfeito! O processo clássico começa sempre na EMPATIA (entender a dor da pessoa), seguida de Definir o problema central, Idear soluções, Prototipar rápido e Testar com o usuário."
                },
                {
                    question: "Como o Design Thinking Canvas se relaciona com o processo de Design Thinking?",
                    options: [
                        "Substitui completamente o processo de Design Thinking.",
                        "É uma ferramenta de marketing digital.",
                        "Não está relacionado ao Design Thinking.",
                        "É uma extensão do Design Thinking com foco em negócios, pessoas e tecnologia."
                    ],
                    correctAnswer: 3,
                    explanation: "Correto! O Canvas pega a base do Design Thinking e a encaixa na tríade da Inovação, garantindo que a ideia seja Desejável (Pessoas), Viável financeiramente (Negócios) e Factível (Tecnologia)."
                },
                {
                    question: "O que é um sprint no contexto do Scrum?",
                    options: [
                        "Uma reunião de revisão do projeto.",
                        "Uma fase de testes de software.",
                        "Uma sessão de brainstorming.",
                        "Um ciclo iterativo e incremental de trabalho."
                    ],
                    correctAnswer: 3,
                    explanation: "Isso mesmo! A Sprint é o coração da agilidade no Scrum: um bloco de tempo fixo onde a equipe foca em entregar uma fatia funcional (incremental) e validável do produto."
                },
                {
                    question: "Ao escolher um método ágil para um negócio digital, o que deve ser considerado?",
                    options: [
                        "A localização geográfica da equipe.",
                        "A natureza do projeto e a experiência da equipe.",
                        "O custo das ferramentas de software.",
                        "A preferência pessoal da equipe de gerenciamento."
                    ],
                    correctAnswer: 1,
                    explanation: "Correto! Não existe metodologia 'perfeita'. Um projeto focado na criação de um produto novo pode exigir Scrum, enquanto uma equipe lidando com manutenções contínuas constantes pode fluir melhor com Kanban."
                }
            ],
            2: [
                {
                    question: "Qual tecnologia emergente é fundamental para a segurança de transações online e registros digitais?",
                    options: [
                        "Realidade virtual.",
                        "Blockchain.",
                        "Internet das Coisas (IoT).",
                        "Inteligência Artificial."
                    ],
                    correctAnswer: 1,
                    explanation: "Correto! O Blockchain atua como um 'livro-razão' digital descentralizado e imutável. Ele garante que um registro ou transação não possa ser apagado ou fraudado, sendo a base de contratos inteligentes e da confiança digital."
                },
                {
                    question: "A Inteligência Artificial é relevante em negócios digitais principalmente por:",
                    options: [
                        "facilitar a tomada de decisões e análise de dados.",
                        "reduzir custos operacionais.",
                        "melhorar a interface do usuário.",
                        "aumentar a velocidade de processamento."
                    ],
                    correctAnswer: 0,
                    explanation: "Perfeito! A IA processa volumes gigantescos de informações para encontrar padrões ocultos que humanos não veriam, gerando insights (previsões) que ajudam a diretoria a tomar decisões de negócio mais assertivas."
                },
                {
                    question: "O que deve ser considerado na avaliação de compatibilidade com sistemas existentes?",
                    options: [
                        "Integração, escalabilidade e flexibilidade.",
                        "Custos de marketing.",
                        "Aspectos legais e regulatórios.",
                        "Impacto ambiental."
                    ],
                    correctAnswer: 0,
                    explanation: "Exato! Ao adotar uma nova ferramenta (como uma IA ou CRM), é crucial saber se ela consegue se conectar (Integrar) ao que a empresa já usa (Sistemas Legados) e se consegue crescer junto com o volume de dados da empresa (Escalar)."
                },
                {
                    question: "Qual é o papel do Scrum Master?",
                    options: [
                        "Facilitar a equipe na aderência às práticas do Scrum.",
                        "Programar o software.",
                        "Gerenciar o orçamento do projeto.",
                        "Definir o escopo do projeto."
                    ],
                    correctAnswer: 0,
                    explanation: "Isso mesmo! O Scrum Master atua como um 'líder servidor'. Ele não manda na equipe, não programa e não define o produto (papel do PO). Ele remove obstáculos e garante que todos sigam os ritos e valores da agilidade."
                },
                {
                    question: "O que caracteriza o Feature-Driven Development (FDD)?",
                    options: [
                        "Enfoque em aplicações móveis.",
                        "Uso intensivo de Inteligência Artificial.",
                        "Desenvolvimento em torno de funcionalidades discretas e gerenciáveis.",
                        "Foco na segurança de dados."
                    ],
                    correctAnswer: 2,
                    explanation: "Correto! O FDD organiza o desenvolvimento em torno de pequenas 'Features' (funcionalidades) que agregam valor direto ao cliente. Isso permite entregas contínuas e facilita a gestão do progresso visual."
                },
                {
                    question: "Quando aplicamos o conceito de blockchain em negócios digitais, qual é o principal benefício para a gestão de cadeias de suprimentos?",
                    options: [
                        "Transparência e rastreabilidade das transações.",
                        "Simplificação da interface do usuário.",
                        "Aumento de publicidade.",
                        "Redução no uso de energia."
                    ],
                    correctAnswer: 0,
                    explanation: "Exato! Na cadeia de suprimentos (Supply Chain), o Blockchain permite rastrear a origem de um produto desde a matéria-prima até a prateleira de forma pública e à prova de adulterações, gerando total transparência."
                },
                {
                    question: "Como a Inteligência Artificial (IA) aplicada ao Big Data pode transformar a tomada de decisões em negócios digitais?",
                    options: [
                        "Reduzindo os custos de armazenamento.",
                        "Fornecendo insights preditivos e personalizados.",
                        "Melhorando a eficiência do servidor.",
                        "Automatizando processos de design."
                    ],
                    correctAnswer: 1,
                    explanation: "Perfeito! O Big Data é o 'combustível' e a IA é o 'motor'. Juntos, eles permitem antecipar o futuro (análise preditiva) e personalizar a oferta para cada cliente em tempo real, como fazem a Netflix e a Amazon."
                },
                {
                    question: "Na avaliação de viabilidade técnica, qual aspecto é crucial ao considerar a adoção de tecnologias emergentes em ambientes empresariais?",
                    options: [
                        "A popularidade da tecnologia.",
                        "As tendências de mercado atuais.",
                        "A capacidade da tecnologia de atender às necessidades do negócio.",
                        "O impacto na cultura organizacional."
                    ],
                    correctAnswer: 2,
                    explanation: "Correto! 'Não use tecnologia só porque é moda'. O pilar da viabilidade exige que a tecnologia escolhida realmente resolva uma dor do cliente e faça sentido para o modelo de negócios (estratégia)."
                },
                {
                    question: "Qual é o papel da prototipagem rápida no desenvolvimento ágil de produtos digitais?",
                    options: [
                        "Aumento do alcance de marketing.",
                        "Determinação do preço final do produto.",
                        "Redução significativa dos custos de desenvolvimento.",
                        "Testar e iterar conceitos rapidamente para aprimorar o design."
                    ],
                    correctAnswer: 3,
                    explanation: "Isso! A prototipagem rápida permite colocar a ideia na mão do usuário cedo. Como diz a regra ágil: 'Erre rápido, erre barato'. Testar e iterar no protótipo evita desperdício de dinheiro programando a coisa errada."
                },
                {
                    question: "Como a ética na IA impacta a confiança do consumidor em produtos digitais?",
                    options: [
                        "Alterando o tempo de entrada no mercado.",
                        "Afetando a percepção da marca e a aceitação do produto.",
                        "Modificando o design do produto.",
                        "Influenciando estratégias de preços."
                    ],
                    correctAnswer: 1,
                    explanation: "Exato! Algoritmos tendenciosos, racistas ou que violam a privacidade destroem a reputação de uma empresa. Uma IA transparente e ética é o que garante que o usuário confie seus dados à sua marca a longo prazo."
                },
                {
                    question: "Qual é a principal consideração ao integrar a Internet das Coisas (IoT) em produtos digitais do ponto de vista da segurança?",
                    options: [
                        "A estética do produto.",
                        "Proteção de dados e prevenção de acessos não autorizados.",
                        "A velocidade da conexão à Internet.",
                        "O custo dos componentes de IoT."
                    ],
                    correctAnswer: 1,
                    explanation: "Correto! Cada novo dispositivo IoT (ex: uma geladeira inteligente) é um novo 'ponto de entrada' (brecha) na sua rede Wi-Fi. Por isso, garantir a proteção contra hackers e acessos não autorizados é a prioridade zero na IoT."
                },
                {
                    question: "Como a adoção de tecnologias emergentes pode influenciar a vantagem competitiva de um negócio digital?",
                    options: [
                        "Aumentando o investimento em publicidade.",
                        "Proporcionando inovação e diferenciação no mercado.",
                        "Reduzindo o tempo de treinamento dos funcionários.",
                        "Simplificando a estrutura organizacional."
                    ],
                    correctAnswer: 1,
                    explanation: "Isso! Usar tecnologias emergentes (IA, Blockchain, IoT) permite criar processos muito mais eficientes e serviços completamente novos, criando um diferencial forte ('Oceano Azul') em relação aos concorrentes engessados."
                },
                {
                    question: "No contexto de desenvolvimento de produtos digitais, o que caracteriza uma abordagem centrada no usuário?",
                    options: [
                        "Design e funcionalidades orientadas às necessidades do usuário.",

                        why: "Argumento de ouro para a prova: O maior risco no meio digital é passar 1 ano programando algo que ninguém quer. O Ágil fatia esse risco. Cada sprint é uma pequena aposta testada no mercado. Errar custa apenas 2 semanas de trabalho, permitindo uma adaptação de rota rápida e barata."
                    }
                ]
            }
        ];

        // ==========================================
        // LÓGICA DE NAVEGAÇÃO E ESTADO
        // ==========================================

        let currentUnit = 1;
        let currentQuestionIndex = 0;
        let isQuestionAnswered = false;

        function switchTab(tabId) {
            document.getElementById('view-simulados').classList.add('hidden');
            document.getElementById('view-discursivas').classList.add('hidden');
            
            // Estilos inativos
            const inactiveClass = "flex-1 py-4 px-8 rounded-full font-black uppercase tracking-wider transition-all duration-300 text-orange-400 hover:bg-orange-50 hover:text-orange-600 border-2 border-transparent";
            
            document.getElementById('tab-simulados').className = inactiveClass;
            document.getElementById('tab-discursivas').className = inactiveClass;

            // Ativação
            const activeClass = "flex-1 py-4 px-8 rounded-full font-black uppercase tracking-wider transition-all duration-300 bg-orange-500 text-white shadow-md transform scale-100";

            if (tabId === 'simulados') {
                document.getElementById('view-simulados').classList.remove('hidden');
                document.getElementById('tab-simulados').className = activeClass;
            } else {
                document.getElementById('view-discursivas').classList.remove('hidden');
                document.getElementById('tab-discursivas').className = activeClass;
                renderDiscursivas();
            }
        }

        function loadUnit(unitNumber) {
            currentUnit = unitNumber;
            currentQuestionIndex = 0;
            
            for(let i=1; i<=4; i++) {
                let btn = document.getElementById(`btn-u${i}`);
                if (i === unitNumber) {
                    btn.classList.add('border-orange-500', 'bg-orange-50');
                    btn.classList.remove('border-transparent');
                    btn.querySelector('div').classList.add('text-orange-500');
                    btn.querySelector('div').classList.remove('text-slate-300');
                    btn.querySelector('h3').classList.add('text-slate-800');
                    btn.querySelector('h3').classList.remove('text-slate-500');
                } else {
                    btn.classList.remove('border-orange-500', 'bg-orange-50');
                    btn.classList.add('border-transparent');
                    btn.querySelector('div').classList.remove('text-orange-500');
                    btn.querySelector('div').classList.add('text-slate-300');
                    btn.querySelector('h3').classList.remove('text-slate-800');
                    btn.querySelector('h3').classList.add('text-slate-500');
                }
            }

            document.getElementById('question-container').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            isQuestionAnswered = false;
            const questions = simuladoData[currentUnit];
            
            if (!questions || questions.length === 0 || currentQuestionIndex >= questions.length) {
                document.getElementById('question-container').innerHTML = `
                    <div class="text-center py-16 fade-in">
                        <div class="inline-block bg-orange-100 p-6 rounded-full mb-6">
                            <i class="fas fa-trophy text-6xl text-orange-500 drop-shadow-md"></i>
                        </div>
                        <h2 class="text-3xl font-black uppercase text-slate-800 mb-2">Unidade ${currentUnit} Finalizada!</h2>
                        <p class="text-slate-500 font-medium mb-8">Excelente trabalho. Você revisou os principais conceitos.</p>
                        <button onclick="location.reload()" class="bg-orange-600 hover:bg-orange-700 text-white px-10 py-4 rounded-full font-black uppercase tracking-wider transition-all shadow-xl hover:scale-105 transform">
                            Voltar ao Início
                        </button>
                    </div>
                `;
                return;
            }

            const q = questions[currentQuestionIndex];
            
            document.getElementById('unit-badge').textContent = `Unidade ${currentUnit}`;
            document.getElementById('question-progress').textContent = `Questão ${currentQuestionIndex + 1} de ${questions.length}`;
            document.getElementById('question-text').textContent = q.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            
            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left p-5 rounded-2xl border-2 border-slate-100 hover:border-orange-400 hover:bg-orange-50 hover:shadow-md transition-all font-bold text-slate-600 option-btn flex items-center relative z-10 group';
                btn.innerHTML = `
                    <span class="flex-shrink-0 inline-flex justify-center items-center w-10 h-10 rounded-full bg-slate-100 text-slate-400 group-hover:bg-orange-200 group-hover:text-orange-600 text-lg font-black mr-5 transition-colors">
                        ${String.fromCharCode(65 + index)}
                    </span> 
                    <span class="leading-relaxed text-base">${opt}</span>
                `;
                btn.onclick = () => selectOption(index, btn);
                optionsContainer.appendChild(btn);
            });

            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.classList.add('hidden');
            feedbackArea.className = 'relative z-10 mt-8 p-6 rounded-[2rem] hidden border-l-8 shadow-inner';
            document.getElementById('next-btn').classList.add('hidden');
        }

        function selectOption(selectedIndex, buttonElement) {
            if (isQuestionAnswered) return;
            isQuestionAnswered = true;

            const q = simuladoData[currentUnit][currentQuestionIndex];
            const isCorrect = selectedIndex === q.correctAnswer;
            const allButtons = document.querySelectorAll('.option-btn');

            allButtons.forEach((btn, index) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-orange-400', 'hover:bg-orange-50', 'border-slate-100', 'group');
                
                const badge = btn.querySelector('span:first-child');

                if (index === q.correctAnswer) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-900', 'shadow-md');
                    badge.classList.add('bg-emerald-500', 'text-white');
                    badge.classList.remove('bg-slate-100', 'text-slate-400');
                } else if (index === selectedIndex && !isCorrect) {
                    btn.classList.add('border-rose-400', 'bg-rose-50', 'text-rose-900');
                    badge.classList.add('bg-rose-500', 'text-white');
                    badge.classList.remove('bg-slate-100', 'text-slate-400');
                } else {
                    btn.classList.add('opacity-40', 'border-slate-50', 'bg-slate-50');
                }
            });

            showFeedback(isCorrect, q.explanation);
        }

        function showFeedback(isCorrect, explanation) {
            const feedbackArea = document.getElementById('feedback-area');
            const feedbackIcon = document.getElementById('feedback-icon');
            const feedbackTitle = document.getElementById('feedback-title');
            const feedbackText = document.getElementById('feedback-text');
            const nextBtn = document.getElementById('next-btn');

            feedbackArea.classList.remove('hidden');
            nextBtn.classList.remove('hidden');

            if (isCorrect) {
                feedbackArea.classList.add('bg-emerald-50', 'border-emerald-400');
                feedbackArea.classList.remove('bg-rose-50', 'border-rose-400');
                feedbackIcon.innerHTML = '<i class="fas fa-check-circle text-emerald-500"></i>';
                feedbackTitle.textContent = 'Exato! Muito bem.';
                feedbackTitle.className = 'font-black text-xl uppercase tracking-wide mb-2 text-emerald-800';
                feedbackText.className = 'font-bold text-emerald-700 leading-relaxed';
            } else {
                feedbackArea.classList.add('bg-rose-50', 'border-rose-400');
                feedbackArea.classList.remove('bg-emerald-50', 'border-emerald-400');
                feedbackIcon.innerHTML = '<i class="fas fa-exclamation-circle text-rose-500"></i>';
                feedbackTitle.textContent = 'Atenção ao Conceito!';
                feedbackTitle.className = 'font-black text-xl uppercase tracking-wide mb-2 text-rose-800';
                feedbackText.className = 'font-bold text-rose-700 leading-relaxed';
            }

            feedbackText.textContent = explanation;
        }

        function nextQuestion() {
            currentQuestionIndex++;
            renderQuestion();
        }

        // Lógica das Discursivas
        function renderDiscursivas() {
            const container = document.getElementById('works-container');
            container.innerHTML = '';

            discursivasData.forEach((work, workIndex) => {
                let termsHTML = '';
                work.terms.forEach((term, termIndex) => {
                    const uniqueId = `term-${workIndex}-${termIndex}`;
                    termsHTML += `
                        <div class="border-b border-orange-100 last:border-0">
                            <button onclick="toggleAccordion('${uniqueId}')" class="w-full text-left py-5 flex justify-between items-center focus:outline-none group">
                                <span class="font-black uppercase tracking-wide text-slate-700 group-hover:text-orange-600 transition-colors text-base md:text-lg flex items-center">
                                    <i class="fas fa-caret-right mr-3 text-orange-300 group-hover:text-orange-500 transition-transform" id="caret-${uniqueId}"></i>
                                    ${term.term}
                                </span>
                            </button>
                            <div id="content-${uniqueId}" class="accordion-content text-slate-600 text-sm">
                                <p class="mb-5 ml-6 text-base font-medium leading-relaxed"><strong class="text-slate-800">Definição Acadêmica:</strong> ${term.definition}</p>
                                <div class="ml-6 bg-orange-100 border-l-4 border-orange-500 p-5 rounded-r-xl text-orange-900 shadow-sm">
                                    <strong class="flex items-center text-orange-800 mb-2 uppercase tracking-wide font-black text-xs md:text-sm"><i class="fas fa-fire text-orange-500 mr-2 text-lg"></i> Por que isso dá nota na prova?</strong>
                                    <p class="leading-relaxed font-medium text-[15px] text-orange-800 opacity-90">${term.why}</p>
                                </div>
                            </div>
                        </div>
                    `;
                });

                const workCard = `
                    <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border-2 border-transparent hover:border-orange-200 transition-colors mb-8">
                        <div class="bg-slate-800 text-white p-6 md:p-8 flex items-center relative overflow-hidden">
                            <div class="absolute -right-6 -top-6 text-slate-700 opacity-30"><i class="fas fa-briefcase text-8xl"></i></div>
                            <div class="relative z-10 flex items-center">
                                <div class="bg-orange-500 w-12 h-12 rounded-full flex justify-center items-center mr-5 shadow-lg">
                                    <i class="fas fa-folder-open text-xl text-white"></i>
                                </div>
                                <h3 class="text-xl md:text-2xl font-black uppercase tracking-wide">${work.title}</h3>
                            </div>
                        </div>
                        <div class="p-6 md:p-8">
                            <div class="mb-8 pb-8 border-b border-orange-100">
                                <h4 class="text-xs md:text-sm font-black uppercase tracking-widest text-orange-500 mb-3">Contexto do Estudo de Caso</h4>
                                <p class="text-slate-600 font-medium italic border-l-4 border-orange-300 pl-4 py-1 text-base">"${work.context}"</p>
                            </div>
                            <div>
                                <h4 class="text-xs md:text-sm font-black uppercase tracking-widest text-orange-500 mb-4">Mapeamento para Questões Abertas</h4>
                                <div class="bg-white rounded-xl">
                                    ${termsHTML}
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += workCard;
            });
        }

        function toggleAccordion(id) {
            const content = document.getElementById(`content-${id}`);
            const caret = document.getElementById(`caret-${id}`);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                caret.style.transform = 'rotate(0deg)';
                caret.classList.replace('text-orange-500', 'text-orange-300');
            } else {
                content.classList.add('open');
                caret.style.transform = 'rotate(90deg)';
                caret.classList.replace('text-orange-300', 'text-orange-500');
            }
        }

        // Iniciar visualização padrão
        loadUnit(1);

    </script>
</body>
</html>
