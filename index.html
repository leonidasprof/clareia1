<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Imagens - Clareia</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background-color: #f8fafc; }
        .foto-perfil { object-fit: cover; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="p-6 md:p-12 text-slate-800">

<div class="max-w-7xl mx-auto">
    <header class="mb-10 text-center md:text-left flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <h1 class="text-3xl font-bold text-[#0056b3] mb-2">Ativos Visuais - Clareia</h1>
            <p class="text-slate-500">Visualize os ativos com QR Code e copie o código HTML.</p>
        </div>
        <div>
            <input type="file" id="uploadInput" accept="image/*" class="hidden">
            <button onclick="document.getElementById('uploadInput').click()" class="bg-[#10b981] hover:bg-[#059669] text-white py-2 px-6 rounded-lg font-semibold transition-colors shadow-sm flex items-center gap-2 w-full md:w-auto justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                Fazer Upload
            </button>
        </div>
    </header>

    <!-- Grid de Imagens -->
    <div id="imageGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        
        <!-- Exemplo de Estrutura de Card (Repita para os demais itens) -->
        <!-- Substitua 'sua_imagem.png' e 'qrcode.png' pelos seus arquivos -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden flex flex-col transition-transform hover:-translate-y-1 hover:shadow-md">
            <div class="h-48 bg-slate-100 flex items-center justify-center p-4 relative">
                <img src="imagem.png" alt="Imagem" class="max-h-full max-w-full object-contain">
                <!-- QR CODE SOBREPOSTO -->
                <img src="qrcode.png" alt="QR Code" class="absolute top-2 right-2 w-12 h-12 bg-white p-1 rounded border shadow-sm">
            </div>
            <div class="p-5 flex-1 flex flex-col justify-between">
                <p class="text-sm font-medium text-slate-700 mb-3 truncate">imagem.png</p>
                <button onclick="copyToClipboard('<img src=\'imagem.png\' alt=\'Ativo Clareia\'>')" class="w-full bg-[#0ea5e9] hover:bg-[#0284c7] text-white py-2 px-4 rounded-lg text-sm font-semibold transition-colors">Copiar Tag HTML</button>
            </div>
        </div>

    </div>
</div>

<div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 z-50">
    <span class="font-medium">Tag HTML copiada!</span>
</div>

<script>
    function copyToClipboard(text) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.top = '-9999px';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        showToast();
    }

    function showToast() {
        const toast = document.getElementById('toast');
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }
</script>

</body>
</html>
