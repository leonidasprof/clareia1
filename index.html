    <!-- Notificação de Sucesso (Toast) -->

    </div>

    <!-- Script para copiar para a área de transferência -->
    <script>
        function copyToClipboard(text) {
            // Cria um elemento textarea temporário
            const textarea = document.createElement('textarea');
            textarea.value = text;
            
            // Impede rolagem na página ao adicionar o elemento
            textarea.style.position = 'fixed';
            textarea.style.top = '-9999px';
            
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                // Executa o comando de cópia
                document.execCommand('copy');
                showToast();
            } catch (err) {
                console.error('Falha ao copiar:', err);
            } finally {
                // Remove o elemento temporário
                document.body.removeChild(textarea);
            }
        }

        // Função para mostrar a notificação temporária
        function showToast() {
            const toast = document.getElementById('toast');
            
            // Mostra o toast
            toast.classList.remove('translate-y-20', 'opacity-0');
            
            // Esconde após 3 segundos
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }
    </script>
